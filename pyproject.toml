[project]
name = "telegram-bot"
version = "0.1.0"
description = "Телеграм бот для практики FAQUp"
requires-python = "<4.0,>=3.12"

dependencies = [
    "python-telegram-bot ~=20.0",
    "pydantic >=2.0.0",
    "pydantic-settings >=0.5.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
verify_ssl = true

[build-system]
requires = ["hatchling >=1.0.0"]
build-backend = "hatchling.build"